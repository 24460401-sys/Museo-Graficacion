<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="600" height="400" fill="#1b1f24"/>

  <!-- Panel izquierdo: imagen "normal" (suave, con degradado) -->
  <text x="140" y="30" fill="#e8e8e8" font-size="16" text-anchor="middle" font-weight="bold">Vista normal</text>
  <clipPath id="roundedLeft">
    <rect x="40" y="45" width="200" height="200" rx="10"/>
  </clipPath>
  <g clip-path="url(#roundedLeft)">
    <defs>
      <radialGradient id="sunGrad" cx="65%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#fff3b0"/>
        <stop offset="35%" stop-color="#ffd166"/>
        <stop offset="100%" stop-color="#4ea8de"/>
      </radialGradient>
      <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4ea8de"/>
        <stop offset="100%" stop-color="#023e8a"/>
      </linearGradient>
    </defs>
    <rect x="40" y="45" width="200" height="120" fill="url(#sunGrad)"/>
    <rect x="40" y="165" width="200" height="80" fill="url(#waterGrad)"/>
    <circle cx="170" cy="90" r="22" fill="#fff9db"/>
  </g>
  <rect x="40" y="45" width="200" height="200" rx="10" fill="none" stroke="#555" stroke-width="2"/>

  <!-- Zona de zoom marcada -->
  <rect x="150" y="120" width="40" height="40" fill="none" stroke="#f77f00" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Flecha -->
  <path d="M 250 145 Q 300 145 350 145" stroke="#f77f00" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f77f00"/>
    </marker>
  </defs>
  <text x="300" y="130" fill="#f77f00" font-size="13" text-anchor="middle">zoom ×20</text>

  <!-- Panel derecho: pixeles individuales -->
  <text x="460" y="30" fill="#e8e8e8" font-size="16" text-anchor="middle" font-weight="bold">Zoom: píxeles visibles</text>
  <g>
    <!-- cuadrícula 8x8 de colores derivados del área ampliada (sol/agua) -->
    <!-- fila 1-2: tonos de sol -->
    <rect x="360" y="45" width="25" height="25" fill="#fff3b0"/>
    <rect x="385" y="45" width="25" height="25" fill="#ffe08a"/>
    <rect x="410" y="45" width="25" height="25" fill="#ffd166"/>
    <rect x="435" y="45" width="25" height="25" fill="#fff9db"/>
    <rect x="460" y="45" width="25" height="25" fill="#ffe08a"/>
    <rect x="485" y="45" width="25" height="25" fill="#ffd166"/>
    <rect x="510" y="45" width="25" height="25" fill="#fff3b0"/>
    <rect x="535" y="45" width="25" height="25" fill="#ffc94a"/>

    <rect x="360" y="70" width="25" height="25" fill="#ffd166"/>
    <rect x="385" y="70" width="25" height="25" fill="#fff9db"/>
    <rect x="410" y="70" width="25" height="25" fill="#fff3b0"/>
    <rect x="435" y="70" width="25" height="25" fill="#ffe08a"/>
    <rect x="460" y="70" width="25" height="25" fill="#ffd166"/>
    <rect x="485" y="70" width="25" height="25" fill="#ffc94a"/>
    <rect x="510" y="70" width="25" height="25" fill="#fff3b0"/>
    <rect x="535" y="70" width="25" height="25" fill="#ffe08a"/>

    <!-- fila transicion sol-agua -->
    <rect x="360" y="95" width="25" height="25" fill="#ffd166"/>
    <rect x="385" y="95" width="25" height="25" fill="#f4c76a"/>
    <rect x="410" y="95" width="25" height="25" fill="#8fc6e0"/>
    <rect x="435" y="95" width="25" height="25" fill="#6db4dd"/>
    <rect x="460" y="95" width="25" height="25" fill="#4ea8de"/>
    <rect x="485" y="95" width="25" height="25" fill="#3d97cf"/>
    <rect x="510" y="95" width="25" height="25" fill="#4ea8de"/>
    <rect x="535" y="95" width="25" height="25" fill="#5aa8d8"/>

    <!-- filas de agua -->
    <rect x="360" y="120" width="25" height="25" fill="#3d97cf"/>
    <rect x="385" y="120" width="25" height="25" fill="#2f7fb8"/>
    <rect x="410" y="120" width="25" height="25" fill="#4ea8de"/>
    <rect x="435" y="120" width="25" height="25" fill="#2f7fb8"/>
    <rect x="460" y="120" width="25" height="25" fill="#1c5f96"/>
    <rect x="485" y="120" width="25" height="25" fill="#3d97cf"/>
    <rect x="510" y="120" width="25" height="25" fill="#2f7fb8"/>
    <rect x="535" y="120" width="25" height="25" fill="#4ea8de"/>

    <rect x="360" y="145" width="25" height="25" fill="#023e8a"/>
    <rect x="385" y="145" width="25" height="25" fill="#0353a4"/>
    <rect x="410" y="145" width="25" height="25" fill="#1c5f96"/>
    <rect x="435" y="145" width="25" height="25" fill="#023e8a"/>
    <rect x="460" y="145" width="25" height="25" fill="#0353a4"/>
    <rect x="485" y="145" width="25" height="25" fill="#1c5f96"/>
    <rect x="510" y="145" width="25" height="25" fill="#023e8a"/>
    <rect x="535" y="145" width="25" height="25" fill="#0353a4"/>

    <rect x="360" y="170" width="25" height="25" fill="#012a63"/>
    <rect x="385" y="170" width="25" height="25" fill="#023e8a"/>
    <rect x="410" y="170" width="25" height="25" fill="#0353a4"/>
    <rect x="435" y="170" width="25" height="25" fill="#012a63"/>
    <rect x="460" y="170" width="25" height="25" fill="#023e8a"/>
    <rect x="485" y="170" width="25" height="25" fill="#012a63"/>
    <rect x="510" y="170" width="25" height="25" fill="#0353a4"/>
    <rect x="535" y="170" width="25" height="25" fill="#023e8a"/>

    <!-- líneas de cuadrícula para resaltar los píxeles -->
    <g stroke="#111417" stroke-width="1.5">
      <line x1="360" y1="45" x2="560" y2="45"/>
      <line x1="360" y1="70" x2="560" y2="70"/>
      <line x1="360" y1="95" x2="560" y2="95"/>
      <line x1="360" y1="120" x2="560" y2="120"/>
      <line x1="360" y1="145" x2="560" y2="145"/>
      <line x1="360" y1="170" x2="560" y2="170"/>
      <line x1="360" y1="195" x2="560" y2="195"/>
      <line x1="360" y1="45" x2="360" y2="195"/>
      <line x1="385" y1="45" x2="385" y2="195"/>
      <line x1="410" y1="45" x2="410" y2="195"/>
      <line x1="435" y1="45" x2="435" y2="195"/>
      <line x1="460" y1="45" x2="460" y2="195"/>
      <line x1="485" y1="45" x2="485" y2="195"/>
      <line x1="510" y1="45" x2="510" y2="195"/>
      <line x1="535" y1="45" x2="535" y2="195"/>
      <line x1="560" y1="45" x2="560" y2="195"/>
    </g>
  </g>
  <rect x="360" y="45" width="200" height="150" fill="none" stroke="#555" stroke-width="2"/>

  <!-- Callout señalando un pixel individual -->
  <circle cx="510" cy="145" r="4" fill="#f77f00"/>
  <line x1="514" y1="145" x2="560" y2="230" stroke="#f77f00" stroke-width="1.5"/>
  <text x="560" y="245" fill="#f77f00" font-size="12" text-anchor="end">1 píxel = 1 color exacto</text>

  <text x="300" y="300" fill="#b8bcc2" font-size="13" text-anchor="middle">Cada cuadro de color es un píxel individual dentro del mapa de bits.</text>
  <text x="300" y="320" fill="#b8bcc2" font-size="13" text-anchor="middle">Al ampliar demasiado la imagen, se pierde el detalle continuo</text>
  <text x="300" y="340" fill="#b8bcc2" font-size="13" text-anchor="middle">y solo se distinguen los bloques de color por separado.</text>

  <text x="300" y="380" fill="#6c757d" font-size="11" text-anchor="middle" font-style="italic">Ilustración esquemática de una imagen rasterizada ampliada · uso educativo</text>
</svg>
