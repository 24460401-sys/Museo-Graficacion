<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="700" height="420" fill="#1b1f24"/>

  <text x="350" y="35" fill="#e8e8e8" font-size="20" text-anchor="middle" font-weight="bold">De WebGL a WebGPU</text>
  <text x="350" y="58" fill="#b8bcc2" font-size="13" text-anchor="middle">Dos formas de comunicar el navegador con la tarjeta gráfica</text>

  <!-- Columna izquierda: WebGL -->
  <text x="175" y="90" fill="#f77f00" font-size="16" text-anchor="middle" font-weight="bold">WebGL</text>

  <rect x="75" y="105" width="200" height="45" rx="8" fill="#2b2f36" stroke="#f77f00" stroke-width="1.5"/>
  <text x="175" y="132" fill="#e8e8e8" font-size="13" text-anchor="middle">Código JavaScript</text>

  <line x1="175" y1="150" x2="175" y2="170" stroke="#8892a0" stroke-width="2" marker-end="url(#arrowGray)"/>

  <rect x="75" y="170" width="200" height="45" rx="8" fill="#2b2f36" stroke="#f77f00" stroke-width="1.5"/>
  <text x="175" y="192" fill="#e8e8e8" font-size="12" text-anchor="middle">API WebGL</text>
  <text x="175" y="207" fill="#8892a0" font-size="10" text-anchor="middle">(basada en OpenGL ES)</text>

  <line x1="175" y1="215" x2="175" y2="235" stroke="#8892a0" stroke-width="2" marker-end="url(#arrowGray)"/>

  <rect x="75" y="235" width="200" height="45" rx="8" fill="#2b2f36" stroke="#f77f00" stroke-width="1.5"/>
  <text x="175" y="257" fill="#e8e8e8" font-size="12" text-anchor="middle">Capa de traducción</text>
  <text x="175" y="272" fill="#8892a0" font-size="10" text-anchor="middle">del controlador gráfico</text>

  <line x1="175" y1="280" x2="175" y2="300" stroke="#8892a0" stroke-width="2" marker-end="url(#arrowGray)"/>

  <rect x="75" y="300" width="200" height="45" rx="8" fill="#3a2a1a" stroke="#f77f00" stroke-width="2"/>
  <text x="175" y="327" fill="#ffd166" font-size="13" text-anchor="middle" font-weight="bold">GPU</text>

  <text x="175" y="365" fill="#8892a0" font-size="11" text-anchor="middle">Más pasos intermedios →</text>
  <text x="175" y="380" fill="#8892a0" font-size="11" text-anchor="middle">mayor carga de trabajo en JS</text>

  <!-- Columna derecha: WebGPU -->
  <text x="525" y="90" fill="#4ea8de" font-size="16" text-anchor="middle" font-weight="bold">WebGPU</text>

  <rect x="425" y="105" width="200" height="45" rx="8" fill="#2b2f36" stroke="#4ea8de" stroke-width="1.5"/>
  <text x="525" y="132" fill="#e8e8e8" font-size="13" text-anchor="middle">Código JavaScript</text>

  <line x1="525" y1="150" x2="525" y2="170" stroke="#8892a0" stroke-width="2" marker-end="url(#arrowGray)"/>

  <rect x="425" y="170" width="200" height="45" rx="8" fill="#2b2f36" stroke="#4ea8de" stroke-width="1.5"/>
  <text x="525" y="192" fill="#e8e8e8" font-size="12" text-anchor="middle">API WebGPU</text>
  <text x="525" y="207" fill="#8892a0" font-size="10" text-anchor="middle">(inspirada en Metal, Vulkan, D3D12)</text>

  <line x1="525" y1="215" x2="525" y2="300" stroke="#4ea8de" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="555" y="260" fill="#4ea8de" font-size="10">acceso más directo</text>

  <rect x="425" y="300" width="200" height="45" rx="8" fill="#1a2d3a" stroke="#4ea8de" stroke-width="2"/>
  <text x="525" y="327" fill="#9fd4f0" font-size="13" text-anchor="middle" font-weight="bold">GPU</text>

  <text x="525" y="365" fill="#8892a0" font-size="11" text-anchor="middle">Menos capas intermedias →</text>
  <text x="525" y="380" fill="#8892a0" font-size="11" text-anchor="middle">menor carga de trabajo en JS</text>

  <!-- Marcadores -->
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8892a0"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4ea8de"/>
    </marker>
  </defs>

  <line x1="300" y1="105" x2="300" y2="345" stroke="#444" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="350" y="405" fill="#6c757d" font-size="11" text-anchor="middle" font-style="italic">Diagrama esquemático comparativo · uso educativo</text>
</svg>
